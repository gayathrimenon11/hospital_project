[project]
name = "hospital-backend"
version = "0.1.0"
description = "Hospital Queue System FastAPI Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
